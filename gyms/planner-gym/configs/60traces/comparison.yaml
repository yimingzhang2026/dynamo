# Source for scripts/prepare_comparison.py; this is not a Match Config.
worker_limits:
  min_total: 2
  max_total: 16
planners: [mpc, planner, keda, reactive, jev]
jev:
  exclude_duration_at_least_s: 86400
  max_calls: 600
  poll_interval_s: 15
parallel:
  # Target: a Linux CPU host with 32 physical cores and 256 GiB RAM.
  physical_cores: 32
  memory_gib: 256
  reserve_cores: 2
  reserve_memory_gib: 32
  max_parallel_runs: 4
  cores_per_run: 2
  max_parallel_jev: 1
  exclusive_at_memory_gib: 64
  # Historical static RSS is an estimate, not a dynamic-run guarantee.
  memory_multiplier: 2
  extra_memory_gib: 2
  minimum_memory_gib: 8
  thread_environment:
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
    NUMEXPR_NUM_THREADS: '1'
    VECLIB_MAXIMUM_THREADS: '1'
    RAYON_NUM_THREADS: '2'
    TOKIO_WORKER_THREADS: '2'
