schema_version: 1
name: A-HT-L01
description: Static full-window baseline; prepare the verified input with scripts/prepare_60traces.py.
labels:
  dataset: ragpulse
  regime: HT
  deployment_size: large
  input_preparation: frozen-original-scaler
backend:
  type: sim
  topology: agg
  gpu_budget: 128
  model:
    name: deepseek-ai/DeepSeek-V4-Pro
    ais_model_path: deepseek-ai/DeepSeek-V4-Pro
  engines:
    aggregate:
      system: b300_sxm
      backend: vllm
      backend_version: 0.24.0
      ais_backend: vllm
      ais_backend_version: 0.24.0
      tp_size: 1
      attention_dp_size: 8
      moe_tp_size: 1
      moe_ep_size: 8
      runtime:
        cold_start_delay_s: 0
      extra_args:
        max_num_seqs: 256
        max_num_batched_tokens: 8192
        enable_prefix_caching: true
        enable_chunked_prefill: true
        gpu_memory_utilization: 0.9
  router:
    mode: round_robin
  replay:
    ais_bootstrap: false
    request_capture: jsonl
    telemetry_sample_interval_s: 5
  autoscalers:
  - name: static
    type: static
    config:
      num_decode: 16
evaluations:
  traces:
  - name: input-a-ht-l01
    format: dynamo
    block_size: 64
    paths:
    - ../../data/60traces/reproduction/generated/A-HT-L01.jsonl
  defaults:
    seed: 20260928
    arrival_speedup: 1.0
    measurement_window:
      start_s: 0.0
      end_s: 86400.0
slo_profiles:
- name: HT-S
  ttft_ms: 2000
  itl_ms: 50
metrics:
  rank_by: goodput_per_gpu
  short_output_itl: skip
execution:
  max_parallel_runs: 1
  timeout_s: 1500
  max_memory_mb: 16384
  fail_fast: false
publish:
  artifact_root: ../../runs/60traces/A-HT-L01/artifacts
  destinations:
  - type: console
  - type: json
    path: ../../runs/60traces/A-HT-L01/results.json
  - type: html
    path: ../../runs/60traces/A-HT-L01/report.html
