<body>
<header class="topbar"><div class="wrap"><a class="brand" href="index.html">PLANNER <span>60-trace benchmark</span></a><nav class="nav" aria-label="Leaderboards"><a href="index.html" data-nav="overview">Overview</a><a href="aggregated.html" data-nav="agg">Aggregated</a><a href="disaggregated.html" data-nav="disagg">Disaggregated</a><a href="latency.html" data-nav="latency">Latency &amp; SLO</a><a href="slo-rankings.html" data-nav="slo-ranking">SLO Rankings</a></nav></div></header>
<main class="wrap" id="app"></main>
<dialog id="case-dialog" aria-labelledby="case-title"><div class="dialog-head"><div><h2 id="case-title"></h2><p id="case-subtitle"></p></div><button class="close" id="close-dialog">Close ×</button></div><div class="dialog-body" id="case-content"></div></dialog>
<noscript><p style="padding:30px">Enable JavaScript to view these offline leaderboards, or open leaderboard-summary.csv and the per-case CSV files alongside this page.</p></noscript>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const {report,selected} = JSON.parse(document.getElementById('report-data').textContent);
const app = document.getElementById('app');
if (report.counts.pending) {
 const notice = document.createElement('div');
 notice.className = 'wrap';
 notice.setAttribute('role', 'status');
 notice.style.cssText = 'padding-top:18px;color:var(--warn)';
 notice.textContent = `${report.counts.pending} corrected results are pending. Only validated current results are shown; rankings use completed shared cases.`;
 app.before(notice);
}
const state = {regime:'all',topology:'all',query:'',attention:false};
const plannerIds = report.core;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number = (x,d=2) => x == null ? '—' : x.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const percent = x => x == null ? '—' : number(x*100,1)+'%';
const hours = s => s == null ? '—' : number(s/3600,2)+' h';
const score = x => x == null ? '—' : x === 0 ? '0' : x.toLocaleString('en-US',{maximumSignificantDigits:4});
const errorMessage = row => row.status === 'pending' ? 'Waiting for a validated full-trace result.' : typeof row.error === 'object' && row.error ? row.error.message : row.error || '';
const failureLabel = row => row.status === 'pending' ? 'Pending' : /memory|RSS/i.test(errorMessage(row)) ? 'Memory limit' : /time/i.test(errorMessage(row)) ? 'Timeout' : row.status === 'invalid' ? 'Invalid result' : 'Failed';
const activePage = report.pages[selected] || null;
const csvName = selected==='agg' ? 'aggregated-runs.csv' : 'disaggregated-runs.csv';
const date = new Date(report.generated_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'America/Los_Angeles'});
const isIncomplete = c => report.core.some(p=>c.rows[p].status!=='completed');
const regimeLabel = () => state.regime==='all' ? 'All cases' : state.regime==='HT' ? 'HT · throughput' : 'LC · latency';
document.querySelector(`[data-nav="${selected || 'overview'}"]`).setAttribute('aria-current','page');
document.getElementById('close-dialog').onclick=()=>document.getElementById('case-dialog').close();
function rankTable(cohort,compact=false){
 const leaders=cohort.rows, best=Math.min(...leaders.map(r=>r.mean_rank ?? Infinity));
 return `<div class="table-scroll"><table class="ranking ${compact?'compact':''}" aria-label="Core controller rankings"><thead><tr><th>Place</th><th>Controller</th><th title="Average rank within each shared case; lower is better">Mean rank ↓</th><th title="Case wins; exact ties split one win">Wins</th><th title="Mean SLO success fraction across the same shared cases">SLO success</th>${compact?'':'<th title="Successful runs out of planned runs in this view">Completed</th>'}</tr></thead><tbody>${leaders.map(r=>`<tr class="${r.mean_rank!=null&&r.mean_rank===best?'top':''}" data-planner="${r.planner}"><td><span class="place">${r.rank == null?'—':number(r.rank,Number.isInteger(r.rank)?0:1)}</span></td><td>${esc(r.name)}</td><td><span class="rank-value">${number(r.mean_rank,3)}</span><span class="track" style="--position:${r.mean_rank==null?0:(r.mean_rank-1)/(leaders.length-1)*100}%" aria-hidden="true"></span></td><td>${number(r.wins,Number.isInteger(r.wins)?0:2)}</td><td>${percent(r.mean_good_rate)}</td>${compact?'':`<td>${r.completed}<span class="muted"> / ${r.expected}</span></td>`}</tr>`).join('')}</tbody></table></div>`;
}
function stats(view){
 const failed=view.expected-(view.counts.completed||0);
 return `<div class="stats" aria-live="polite"><div class="stat"><div class="stat-label">Validated results</div><div class="stat-value">${view.counts.completed||0}<span> / ${view.expected}</span></div><div class="small">Six planners across 60 traces</div></div><div class="stat"><div class="stat-label">Shared cases</div><div class="stat-value">${view.core.shared_cases.length}<span> / ${view.core.case_count}</span></div><div class="small">Same cases for every planner</div></div><div class="stat"><div class="stat-label">Planners ranked</div><div class="stat-value">${report.core.length}</div><div class="small">Including Static and KnowLine</div></div><div class="stat"><div class="stat-label">Pending or failed runs</div><div class="stat-value" style="color:${failed?'var(--warn)':'var(--accent)'}">${failed}</div><div class="small">${failed?'Kept visible; excluded from ranks':'Every planned run in this view complete'}</div></div></div>`;
}

const resourceMultiplier=report.resource_policy.gpu_budget_multiplier;
const extraWorkers=report.resource_policy.gpu_budget_extra_workers;
const additiveBudget=Number.isInteger(extraWorkers);
const resourcePolicyKey=additiveBudget?`baseline-plus-${extraWorkers}-max-workers`:`${resourceMultiplier}x`;
const resourcePolicyTitle=additiveBudget?`Static + ${extraWorkers} × max(worker GPUs)`:`${resourceMultiplier}× Static`;
const resourcePolicyText=additiveBudget?`the original Static GPU allocation plus ${extraWorkers} × the largest per-worker GPU cost`:`${resourceMultiplier}× the original Static GPU allocation`;
const workerPolicyText=report.resource_policy.worker_limits ? `Total workers: ${report.resource_policy.worker_limits.min_total}–${report.resource_policy.worker_limits.max_total}, matching the retained campaign.` : 'Minimum: one worker per active pool; maxima follow the GPU ceiling.';
function setupFor(c){return report.experiment_setup.rows[c.case_id];}

const latencyPolicy = Object.freeze({meanWarning:1,meanSevere:5,goodWarning:.5,goodSevere:.2});
function latencyBand(ratio){return ratio>=latencyPolicy.meanSevere?'severe':ratio>latencyPolicy.meanWarning?'over':'';}
function goodRateBand(rate){return rate<latencyPolicy.goodSevere?'severe':rate<=latencyPolicy.goodWarning?'over':'';}
function latencyAssessment(goodRate,ttftRatio,itlRatio){
 const validGood=Number.isFinite(goodRate)&&goodRate>=0&&goodRate<=1;
 const measures=[['Mean TTFT',ttftRatio],['Mean ITL',itlRatio]];
 const missing=!validGood||measures.some(([,ratio])=>!Number.isFinite(ratio)||ratio<0);
 const signals=[];
 if(validGood)signals.push({band:goodRateBand(goodRate),reason:`Good rate ${number(goodRate*100,4)}%`});
 for(const [name,ratio] of measures)if(Number.isFinite(ratio)&&ratio>=0)signals.push({band:latencyBand(ratio),reason:`${name} ${number(ratio,4)}× SLO`});
 const band=signals.some(s=>s.band==='severe')?'severe':signals.some(s=>s.band==='over')?'over':missing?'missing':'';
 const reasons=signals.filter(s=>s.band).map(s=>s.reason);
 if(!reasons.length&&!missing)reasons.push('Good rate > 50%; both means ≤ 1× SLO');
 if(missing)reasons.push('Incomplete metrics; available metrics can trigger an alert, but cannot clear the cell');
 return {band,missing,label:{severe:'Red',over:'Yellow',missing:'Incomplete','':'No alert'}[band],reason:reasons.join('; ')};
}
function latencyMetric(value,objective,label){
 if(!Number.isFinite(value)||value<0)return `<div class="latency-line"><span class="latency-label">${label}</span><span class="latency-value latency-unreported">— not reported</span></div>`;
 const ratio=value/objective;
 return `<div class="latency-line" data-metric="${label.toLowerCase()}" data-value="${value}" data-ratio="${ratio}"><span class="latency-label">${label}</span><span class="latency-value">${number(value,1)} ms</span><span class="latency-ratio ${latencyBand(ratio)}" title="Mean ${label} / ${number(objective,0)} ms SLO">${number(ratio,2)}×</span></div>`;
}
function latencyResult(c,p){return p==='static'&&report.static_latency?.rows[c.case_id]||c.rows[p];}
function assessMetrics(c,m){
 const ratios=[['mean_ttft_ms','ttft_ms'],['mean_itl_ms','itl_ms']].map(([metric,slo])=>Number.isFinite(m[metric])&&m[metric]>=0?m[metric]/c[slo]:null);
 return latencyAssessment(m.good_rate,...ratios);
}

}

function latencySummaryCounts(){

function adjustedCaseRanks(scores,redPlanners){
 const red=new Set(redPlanners),worst=Object.keys(scores).length;
 const ordered=Object.keys(scores).filter(p=>!red.has(p)).sort((a,b)=>scores[b]-scores[a]||a.localeCompare(b));
 const ranks=Object.fromEntries([...red].map(p=>[p,worst]));
 for(let start=0;start<ordered.length;){
  let end=start+1;
  while(end<ordered.length&&scores[ordered[end]]===scores[ordered[start]])end++;
  for(let i=start;i<end;i++)ranks[ordered[i]]=(start+1+end)/2;
  start=end;
 }
 return ranks;
}
function sloAdjustedRanking(page){
 const ids=new Set(page.views.all.core.shared_cases),cases=page.cases.filter(c=>ids.has(c.case_id));
 const perCase=cases.map(c=>{
  const scores=Object.fromEntries(report.core.map(p=>[p,c.rows[p].metrics.goodput_per_gpu]));
  const red=report.core.filter(p=>assessMetrics(c,latencyResult(c,p).metrics).band==='severe');
  return {case_id:c.case_id,red,ranks:adjustedCaseRanks(scores,red)};
 });
 const rows=report.core.map(p=>({planner:p,name:report.planners[p],
  mean_rank:perCase.length?perCase.reduce((sum,c)=>sum+c.ranks[p],0)/perCase.length:null,
  red_results:perCase.filter(c=>c.red.includes(p)).length,
  completed:page.cases.filter(c=>c.rows[p].status==='completed').length,expected:page.cases.length
 })).sort((a,b)=>(a.mean_rank??Infinity)-(b.mean_rank??Infinity)||a.name.localeCompare(b.name));
 return {rows,per_case:perCase,case_count:cases.length,red_results:perCase.reduce((sum,c)=>sum+c.red.length,0)};
}
function sloRankingPage(){
 document.title='Planner · SLO Rankings';
 app.innerHTML=`<div class="hero"><div><div class="eyebrow">60 traces / 6 planners / red results rank last</div><h1>SLO Rankings</h1><p>Compare the planners with collapsed results assigned rank #6. Lower mean rank is better.</p></div><span class="tag">RED = RANK #6</span></div><div class="overview-grid">${Object.entries(report.pages).map(([key,page])=>{
  const adjusted=sloAdjustedRanking(page),winner=adjusted.rows[0];
  return `<article class="overview-card" data-slo-topology="${key}"><span class="tag">${key==='agg'?'A · AGGREGATED':'D · DISAGGREGATED'}</span><h2>${esc(page.title)}</h2><p class="muted small">${key==='agg'?'Prefill and decode share the same workers.':'Prefill and decode use separate worker pools.'}</p><div class="winner">${winner.mean_rank==null?'Awaiting shared cases':esc(winner.name)}</div><p class="small muted">Leads with SLO penalties · ${number(winner.mean_rank,3)} mean rank</p><div class="table-scroll"><table class="ranking" aria-label="${esc(page.title)} rankings with SLO penalties"><thead><tr><th>Controller</th><th>Mean rank ↓</th><th>Completed</th></tr></thead><tbody>${adjusted.rows.map(r=>`<tr data-planner="${r.planner}" class="${r.mean_rank!=null&&r.mean_rank===winner.mean_rank?'top':''}"><td>${esc(r.name)}</td><td>${number(r.mean_rank,3)}</td><td>${r.completed} / ${r.expected}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:17px 0">${adjusted.case_count} shared traces · ${adjusted.red_results} red results assigned rank #6</p><a class="primary-link" href="latency.html#latency-${key}">View latency and SLO →</a></article>`;
 }).join('')}</div><p class="overview-note">Every red result receives rank #6, even when several planners are red on the same trace. The remaining planners rank from #1 by the original Overview goodput-per-GPU scores, with average ranks for ties. Yellow results receive no penalty. Each of the 30 traces has equal weight; Overview keeps its original results.</p><p class="small muted">Red means good rate &lt; ${number(latencyPolicy.goodSevere*100,0)}% or mean TTFT or ITL ≥ ${latencyPolicy.meanSevere}× its SLO. Red flags match Latency &amp; SLO, including Static’s updated latency measurements.</p>${experimentSetup(selected==='agg'||selected==='disagg'?selected:null)}${methods()}${footer()}`;
}
function traceRanges(suffixes){
 return ['S','L'].flatMap(prefix=>{
  const values=[...new Set(suffixes.filter(s=>s.startsWith(prefix)).map(s=>Number(s.slice(1))))].sort((a,b)=>a-b),ranges=[];
  const label=n=>prefix+String(n).padStart(2,'0');
  for(let i=0;i<values.length;i++){
   const start=values[i];let end=start;
   while(values[i+1]===end+1)end=values[++i];
   ranges.push(label(start)+(end===start?'':'–'+label(end)));
  }
  return ranges;
 }).join(' · ');
}
function latencyGuide(){
 const groups=new Map();
 for(const page of Object.values(report.pages))for(const c of page.cases){
  const key=`${c.regime}:${c.ttft_ms}:${c.itl_ms}`;
  if(!groups.has(key))groups.set(key,{regime:c.regime,ttft:c.ttft_ms,itl:c.itl_ms,cases:[]});
  groups.get(key).cases.push(c.case_id);
 }
 return `<section class="panel latency-guide" id="latency-guide"><div class="panel-head"><div><h2>SLA / SLO limits</h2><p>Saved per-request latency limits, shared by aggregated (A) and disaggregated (D) traces. Every trace column repeats its own limits.</p></div></div><div class="latency-slo-grid">${[...groups.values()].map(g=>`<div class="latency-slo-card" data-slo-regime="${g.regime}" data-ttft="${g.ttft}" data-itl="${g.itl}" data-traces="${g.cases.join(',')}"><b>${g.regime==='HT'?'HT · Throughput-focused':'LC · Latency-focused'}</b><div class="mono">${traceRanges(g.cases.map(id=>id.split('-').at(-1)))}</div><div>TTFT ≤ <strong>${number(g.ttft,0)} ms</strong></div><div>Request-mean ITL ≤ <strong>${number(g.itl,0)} ms</strong></div></div>`).join('')}</div><div class="panel-head" style="padding-top:0"><div><h3>How cell colors are decided</h3><p>Evaluate good rate, mean TTFT / SLO and mean ITL / SLO separately, then use the worst color. Red always overrides yellow.</p></div></div><div class="latency-rules"><div class="latency-rule severe"><b>Red</b>Good rate &lt; ${number(latencyPolicy.goodSevere*100,0)}%, or either mean ≥ ${latencyPolicy.meanSevere}× its SLO.</div><div class="latency-rule over"><b>Yellow · if no red rule applies</b>Good rate ${number(latencyPolicy.goodSevere*100,0)}–${number(latencyPolicy.goodWarning*100,0)}% inclusive, or either mean &gt; ${latencyPolicy.meanWarning}× and &lt; ${latencyPolicy.meanSevere}× its SLO.</div><div class="latency-rule"><b>No alert · all three metrics required</b>Good rate &gt; ${number(latencyPolicy.goodWarning*100,0)}% and both means ≤ ${latencyPolicy.meanWarning}× their SLOs.</div></div><div class="footnote">These are display thresholds; “No alert” does not mean every request meets SLO. Good rate is the percentage of attempted requests meeting the saved scoring contract. Missing metrics remain unavailable: known values may trigger red/yellow (*), otherwise the cell is gray. Hover over a cell for the triggered rules.</div></section>`;
}
function renderLatencyTables(){
 document.querySelectorAll('[data-regime]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.regime===state.regime)));
 document.getElementById('latency-tables').innerHTML=['disagg','agg'].map(topology=>{
  const page=report.pages[topology],cases=page.cases.filter(c=>(state.regime==='all'||c.regime===state.regime)&&(!state.query||`${c.case_id} ${c.dataset} ${c.source_id}`.toLowerCase().includes(state.query)));
  return `<section class="panel" id="latency-${topology}"><div class="panel-head"><div><h2>${esc(page.title)}</h2><p>Rows: planners · Columns: traces · Each cell: good rate, mean TTFT and mean ITL</p></div><span class="right-note">${cases.length} traces · ${report.core.length} planners</span></div><div class="table-scroll latency-scroll" tabindex="0" role="region" aria-label="${esc(page.title)} latency table; scroll horizontally for all traces">${cases.length?`<table class="latency-table" aria-label="${esc(page.title)} good rate and mean latency by planner and trace"><thead><tr><th scope="col">Planner<span class="dataset" style="display:block">Mean latency · ms<br>Badge = × trace SLO</span></th>${cases.map(c=>`<th scope="col" data-trace="${c.case_id}"><button class="case-button mono" data-case="${c.case_id}">${c.case_id} ↗</button><div class="dataset">${esc(c.dataset)}</div>${experimentCase(c)}<div class="latency-objectives">SLO: TTFT ${number(c.ttft_ms,0)} ms · ITL ${number(c.itl_ms,0)} ms</div></th>`).join('')}</tr></thead><tbody>${report.core.map(p=>`<tr data-planner="${p}"><th scope="row">${esc(report.planners[p])}${p==='static'&&report.static_latency?'<div class="dataset">Latency evaluation</div>':''}</th>${cases.map(c=>latencyCell(c,p)).join('')}</tr>`).join('')}</tbody></table>`:'<p class="empty">No traces match these filters.</p>'}</div><div class="footnote">Scroll horizontally to see every trace. Planner names stay visible. Click Diagnose in a red cell for a brief explanation. Click a trace ID for its saved result details.</div></section>`;
 }).join('');
}
function latencyPage(){
 document.title='Planner · Latency & SLO';
 app.innerHTML=`<div class="hero"><div><div class="eyebrow">60 traces / 6 planners / serving latency</div><h1>Latency &amp; SLO</h1><p>Good rate measures how many requests meet the objectives. Mean TTFT and ITL show the magnitude of latency degradation.</p></div><span class="tag">360 PLANNER / TRACE RESULTS</span></div>${latencySummary()}${latencyGuide()}${experimentSetup()}<div class="latency-intro"><p>Each cell shows good rate, mean TTFT and mean ITL in milliseconds, plus latency / SLO multiples. Static uses the same current validated replay in every tab. Each completed result supplies its good rate and latency measurements; pending cells remain blank. Per-metric colors show each signal; the cell color shows the worst signal.</p></div><div class="filterbar"><div class="segmented" role="group" aria-label="Benchmark regime"><button data-regime="all" aria-pressed="true">All traces</button><button data-regime="HT" aria-pressed="false">HT</button><button data-regime="LC" aria-pressed="false">LC</button></div><input class="search" id="latency-search" type="search" placeholder="Search trace ID or dataset…" aria-label="Search traces in both latency tables"></div><div id="latency-tables"></div><div class="downloads" style="margin-bottom:20px"><a href="static-latency-runs.csv" download>Static rerun metrics (CSV)</a></div>${footer()}`;
 document.querySelectorAll('[data-regime]').forEach(button=>button.onclick=()=>{state.regime=button.dataset.regime;renderLatencyTables();});
 document.getElementById('latency-search').oninput=e=>{state.query=e.target.value.toLowerCase();renderLatencyTables();};
 app.addEventListener('click',e=>{const diagnosis=e.target.closest('button[data-diagnose-case]');if(diagnosis){showDiagnosis(diagnosis.dataset.diagnoseCase,diagnosis.dataset.diagnosePlanner);return;}const button=e.target.closest('button[data-case]');if(button)showCase(button.dataset.case);});
 renderLatencyTables();
}

if(selected==='slo-ranking')sloRankingPage();else if(selected==='latency')latencyPage();else if(selected)page();else overview();
app.insertAdjacentHTML('afterbegin', `<div class="panel" data-resource-policy="${resourcePolicyKey}" style="padding:16px 22px;margin-bottom:20px"><b>GPU allowance = ${esc(resourcePolicyText)}.</b> All planners start with the original fleet. ${esc(workerPolicyText)} Active, starting and draining workers share the ceiling.</div>`);
</script>
